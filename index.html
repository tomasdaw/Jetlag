<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1b2d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Jet Lag">
  <title>Jet Lag Companion</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <!-- Shared SVG fill for ruled-out map areas (referenced as url(#jl-hatch)). -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <pattern id="jl-hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(-45)">
        <rect width="8" height="8" fill="#3b8d9c"/>
        <rect width="4" height="8" fill="#22596a"/>
      </pattern>
    </defs>
  </svg>

  <div id="map"></div>

  <header id="topbar">
    <div class="brand">Jet Lag <span>Companion</span></div>
    <div id="area-stat" class="stat">Loading…</div>
  </header>

  <div id="map-controls">
    <button id="btn-gps" class="fab" title="Follow my GPS" aria-label="Follow my GPS">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8" fill="none"/></svg>
    </button>
    <button id="btn-place" class="fab" title="Place my position on the map" aria-label="Place my position on the map">
      <svg viewBox="0 0 24 24"><path d="M12 22s7-7.2 7-12.5A7 7 0 0 0 5 9.5C5 14.8 12 22 12 22z" fill="none"/><circle cx="12" cy="9.5" r="2.5"/></svg>
    </button>
    <button id="btn-fit" class="fab" title="Zoom to possible area" aria-label="Zoom to possible area">
      <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none"/></svg>
    </button>
  </div>

  <div id="mode-banner" hidden>
    <span id="mode-text"></span>
    <div id="mode-actions"></div>
  </div>

  <section id="sheet">
    <button class="sheet-handle" id="sheet-handle" aria-label="Expand or collapse panel"><span></span></button>
    <nav class="tabs" role="tablist">
      <button data-tab="ask" class="active" role="tab">Ask</button>
      <button data-tab="log" role="tab">Log <span id="log-count" class="pill"></span></button>
      <button data-tab="setup" role="tab">Setup</button>
    </nav>
    <div class="tab-body" id="tab-ask"></div>
    <div class="tab-body" id="tab-log" hidden></div>
    <div class="tab-body" id="tab-setup" hidden></div>
  </section>

  <div id="toast" hidden></div>

  <div id="dialog" hidden>
    <div class="dialog-card" role="alertdialog" aria-modal="true" aria-labelledby="dialog-text">
      <p id="dialog-text"></p>
      <div class="dialog-actions">
        <button class="btn" id="dialog-cancel">Cancel</button>
        <button class="btn primary" id="dialog-ok">OK</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/@turf/turf@7.1.0/turf.min.js"></script>
  <script src="config/game-config.js"></script>
  <script src="js/geometry.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
